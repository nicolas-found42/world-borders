name: Bug or usability problem
description: Report observable behavior with evidence and testable outcomes.
title: '[Bug] '
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and impact
      description: Who is affected, what happens, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction and environment
      description: Include exact URL or revision, browser, viewport, steps, expected behavior and actual behavior.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add logs, source links, or screenshots with their context. Never include credentials or private data.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable, testable conditions that establish the fix.
    validations:
      required: true
